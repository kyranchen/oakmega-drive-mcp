[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oakmega-drive-mcp-server"
version = "0.1.0"
description = "Remote MCP server exposing a read-only Google Drive folder to Claude Code."
requires-python = ">=3.11"

dependencies = [
    # --- Web layer ---
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",

    # --- MCP protocol ---
    # 2.x renamed FastMCP -> MCPServer and ships an OAuth AS framework
    # under mcp.server.auth. Pinned to 2.x deliberately.
    "mcp>=2.2,<3",

    # --- Google OAuth + Drive ---
    "google-auth>=2.34",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.145",

    # --- Token persistence ---
    "google-cloud-firestore>=2.18",

    # --- Content extraction ---
    "pypdf>=5.0",

    # --- Outbound HTTP (Google token endpoint) ---
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
# " ".join([...]) reads better than an f-string for the OAuth scope list.
ignore = ["FLY002"]
